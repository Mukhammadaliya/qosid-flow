<svg xmlns="http://www.w3.org/2000/svg" width="1312" height="256" viewBox="0 0 164 32" role="img" aria-label="QosID Flow">
  <title>QosID Flow</title>
  <!-- Mark + wordmark, for LIGHT backgrounds. The dark-background variant is
       qosid-flow-logo-light.svg; the mark alone is qosid-flow-mark.svg.

       Proportions follow frontend/src/layout/Logo.tsx exactly: on a 32-unit mark the gap is
       0.36 x 32 = 11.52 and the wordmark is 0.64 x 32 = 20.48 with -0.02em tracking. Keeping
       those ratios is what makes this file and the running app read as the same logo.

       CAVEAT: the wordmark is live <text>, so it renders with whatever font the viewer has.
       For anything you hand to someone else — an application form, a slide, a print shop —
       use the PNG export instead, where the type is already rasterised. -->
  <rect x="3" y="3" width="24" height="26" rx="7.5" fill="none" stroke="#0095D9" stroke-width="4.2"/>
  <rect x="19" y="18.6" width="12" height="5.4" rx="2.7" fill="#2EC27E"/>
  <text x="43.5" y="22.7"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="20.48" font-weight="700" letter-spacing="-0.41" fill="#16232E">QosID Flow</text>
</svg>
