<svg xmlns="http://www.w3.org/2000/svg" width="1312" height="256" viewBox="0 0 164 32" role="img" aria-label="QosID Flow">
  <title>QosID Flow</title>
  <!-- Mark + wordmark, for DARK backgrounds — the pitch deck runs on #05090e, so this is the
       variant its closing frame uses. Identical geometry to qosid-flow-logo.svg; only the
       wordmark fill changes. The mark itself is unchanged on purpose: signal blue and flow
       green both hold their contrast on dark, so recolouring them would weaken the brand for
       no gain. -->
  <rect x="3" y="3" width="24" height="26" rx="7.5" fill="none" stroke="#0095D9" stroke-width="4.2"/>
  <rect x="19" y="18.6" width="12" height="5.4" rx="2.7" fill="#2EC27E"/>
  <text x="43.5" y="22.7"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="20.48" font-weight="700" letter-spacing="-0.41" fill="#FFFFFF">QosID Flow</text>
</svg>
