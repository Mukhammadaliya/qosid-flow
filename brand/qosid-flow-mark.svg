<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 32 32" role="img" aria-label="QosID Flow">
  <title>QosID Flow</title>
  <!-- Geometry is copied verbatim from frontend/src/layout/Logo.tsx (32-unit grid), so the
       app, the favicon and this file cannot drift apart.

       The mark is a gateway wall in signal blue with a delivered request breaking out
       through its lower-right edge in flow green. That break sits exactly where a Q's tail
       sits, so the shape reads as both the letter and the mechanic at once.

       A rounded SQUARE with a HORIZONTAL tail is deliberate: an earlier circle-plus-diagonal
       version read as the Mars glyph at a glance. Do not round the wall into a circle and do
       not angle the tail. -->
  <rect x="3" y="3" width="24" height="26" rx="7.5" fill="none" stroke="#0095D9" stroke-width="4.2"/>
  <rect x="19" y="18.6" width="12" height="5.4" rx="2.7" fill="#2EC27E"/>
</svg>
