server:
  port: ${OPS_PORT:8092}
  servlet:
    session:
      cookie:
        name: OPS_SESSION   # bitta domen ostida gateway JSESSIONID bilan to'qnashmaslik uchun
        # Gateway JSESSIONID bilan bir xil qattiqlashtirish — ops konsoli gateway'ni to'xtata
        # oladi va sozlamalarni yozadi, ya'ni sessiya o'g'irlanishi kamida shunday jiddiy.
        http-only: true
        same-site: lax
        # DEFERRED UNTIL TLS: prod :8092'ga SSH tunnel orqali oddiy HTTP bilan kiriladi —
        # Secure'ni majburlash brauzerni cookie'ni tashlab yuborishga majbur qiladi va ops
        # login darhol buziladi. Tomcat buni request.isSecure() bilan OR qiladi, shuning uchun
        # `false` haqiqiy HTTPS'da avto-aniqlashni saqlaydi. nginx/TLS qo'yilgach COOKIE_SECURE=true.
        secure: ${COOKIE_SECURE:false}

ops:
  security:
    # gateway.security.cookie-secure'ning ops egizagi — OPS-XSRF-TOKEN cookie'siga Secure
    # qo'shadi (OpsSecurityConfig). Bitta COOKIE_SECURE env-var ikki JVM'ning to'rt cookie'sini
    # boshqaradi. HttpOnly bu cookie'da ATAYLAB false — SPA uni JS bilan o'qiydi.
    cookie-secure: ${COOKIE_SECURE:false}
  gateway:
    health-url: ${OPS_GATEWAY_HEALTH_URL:http://localhost:8090/qosid/admin/api/health}
    start-command: ${OPS_GATEWAY_START_COMMAND:}
    stop-command: ${OPS_GATEWAY_STOP_COMMAND:}
  log-file: ${OPS_LOG_FILE:./logs/gateway.log}
  settings-db-path: ${OPS_SETTINGS_DB_PATH:./data/settings}
  # Same key as the gateway's SETTINGS_ENCRYPTION_KEY — secrets must round-trip between both JVMs.
  settings-encryption-key: ${SETTINGS_ENCRYPTION_KEY:}

# Errors/Statistics modullari uchun: Loki va Prometheus gateway'ga bog'liq emas, shuning
# uchun ops sidecar ularni gateway to'xtatilganda ham o'qiy oladi (OpsObservabilityController).
# Kalit nomlari gateway bilan AYNAN bir xil — sozlamalar bazasidagi qator (gateway.loki.url)
# ikkala JVM'da bir xil ishlashi kerak, aks holda operator bir joyda o'zgartirib boshqasida
# eski manzilni ko'radi.
gateway:
  loki:
    url: ${LOKI_URL:http://localhost:3100}
  prometheus:
    url: ${PROMETHEUS_URL:http://localhost:9090}

logging:
  level:
    root: INFO
    uz.greenwhite.ops: INFO
