# Test-classpath-only overrides. Production configuration lives in
# src/main/resources/application.yml and is NOT affected by this file (a .properties file
# does not shadow the main .yml — both are loaded, the yml wins on shared keys).
#
# ops.admin.force-password-change: the default-password gate (OpsDefaultPasswordGateFilter)
# is ON in production. Ops tests seed the shared admin_account themselves and then call
# protected ops routes; any of them that seeds the default admin/admin password would get
# 403 password-change-required instead of exercising the route under test.
# OpsDefaultPasswordGateTest re-enables the gate explicitly and owns its coverage, so
# switching it off here changes nothing about the shipped default.
ops.admin.force-password-change=false
