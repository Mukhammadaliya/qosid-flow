name: secret-scan

# Guards against a repeat of the incident recorded in docs/SECURITY-REMEDIATION.md:
# three real secrets reached git history through committed config files.
#
# The scan covers FULL history (fetch-depth: 0), so it also finds the three
# known-and-unremediated secrets. Until history is cleaned the scan step is
# `continue-on-error`, so the job reports without blocking every push.
#
# TWO REQUIRED FOLLOW-UPS once §3 of the remediation doc is done:
#   1. remove `continue-on-error` from the scan step, so new leaks fail the build;
#   2. re-check that the historical findings are gone (the doc has the commands).
# A `.gitleaksignore` with per-finding fingerprints would be the tighter option, but
# the fingerprints (`commit:file:rule:line`) can only be produced by running the
# scanner — take them from this workflow's first report artifact if you prefer that route.

on:
  push:
    branches: [master, debug]
  pull_request:
    branches: [master, debug]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — a leak removed from HEAD still matters

      # Run the scanner as a pinned container rather than a third-party action, so
      # this workflow depends on one immutable artifact instead of a mutable ref.
      # Prefer a digest pin (`zricethezav/gitleaks@sha256:...`) over the version tag
      # below; the tag is used here because the digest must be looked up on a machine
      # with registry access.
      - name: gitleaks detect (full history)
        # Temporary: the three historical secrets are still present, so a hard failure
        # would block every push. Remove this line after remediation — see header.
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.18.4 detect \
            --source=/repo \
            --redact \
            --verbose \
            --exit-code=1 \
            --report-format=sarif \
            --report-path=/repo/gitleaks.sarif

      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
