# Qosid Flow — yagona origin (C-loyiha, v1.13.0)
# SPA statik fayllardan, gateway :8090, ops sidecar :8092.
# Prod'da mavjud server-blokka moslashtiring (TLS sozlamalari o'zgarmaydi).

server {
    listen 443 ssl;
    server_name _;

    # ssl_certificate / ssl_certificate_key — mavjud qiymatlar saqlanadi

    # --- Statik SPA (React Router fallback bilan) ---
    root /opt/services/qosid-flow/frontend/dist;
    index index.html;

    # Hashed build output. Two reasons this is NOT covered by the SPA fallback below:
    #   1. The bundle is route-split (App.tsx lazy imports), so a browser holding an old
    #      index.html can ask for a chunk that a redeploy has already removed. With the
    #      fallback it would receive index.html *as JavaScript* and fail with a confusing
    #      syntax error; a plain 404 makes the SPA's chunk-load failure honest (reload fixes it).
    #   2. Filenames carry a content hash, so they can be cached hard and forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        # index.html must never be cached: it is the document that names the current hashed
        # chunks, so a stale copy is exactly what makes a browser ask for a deleted one.
        add_header Cache-Control "no-cache";
    }

    # --- Gateway API (tashqi /qosid/api/v1/queue klientlari ham shu yo'ldan) ---
    location /qosid/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;   # BiruniUpload multipart
    }

    # --- Ops sidecar API (faqat /ops/api — /ops sahifasi SPA'niki) ---
    location /ops/api/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (logs/stream) uchun bufferlashni o'chirish shart:
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }
}
