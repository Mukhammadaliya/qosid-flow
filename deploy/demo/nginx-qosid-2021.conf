# QosID Flow — demo instansi, 192.168.10.85:2021
#
# TLS BU YERDA TUGATILMAYDI. Ommaviy kirish nuqtasi main.greenwhite.uz (213.230.66.24),
# u qosid.greenwhite.uz uchun sertifikatni ushlaydi va bu yerga oddiy HTTP bilan keladi.
# Shuning uchun:
#   * listen 2021 — ssl yo'q, sertifikat yo'q;
#   * ilovaga so'rov HTTP bo'lib yetadi, ya'ni Tomcat request.isSecure() = false, va
#     cookie'larga `Secure` qo'yilishi uchun .env da COOKIE_SECURE=true bo'lishi SHART;
#   * X-Forwarded-Proto oldingi proksidan keladi — uni qayta yozmaymiz, o'tkazamiz,
#     aks holda ilova o'zini HTTP da deb hisoblab absolyut havolalarni buzadi.

server {
    listen 2021;
    server_name qosid.greenwhite.uz _;

    # Oldingi proksi qancha bersa, shuncha o'tkazamiz. 25m — BiruniUpload multipart uchun
    # (spring.servlet.multipart 50MB/52MB, lekin bu demo va katta yuklash kutilmaydi).
    client_max_body_size 25m;

    # --- Statik SPA ---
    root /opt/services/qosid-flow/frontend/dist;
    index index.html;

    # Hashli build chiqishi. Bu ATAYLAB pastdagi SPA-fallback'ga kirmaydi:
    # bundle route bo'yicha bo'lingan, ya'ni eski index.html'ni ushlab turgan brauzer
    # redeploy o'chirib tashlagan chunk'ni so'rashi mumkin. Fallback bilan u index.html'ni
    # JavaScript sifatida oladi va tushunarsiz sintaksis xatosi beradi; toza 404 esa
    # SPA'ning chunk-load xatosini halol qiladi (sahifani yangilash tuzatadi).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        # index.html hech qachon keshlanmaydi: u hozirgi hashli chunk'lar nomini saqlaydi,
        # ya'ni eskirgan nusxa aynan o'chirilgan chunk'ni so'rashga majbur qiladi.
        add_header Cache-Control "no-cache";
    }

    # --- Gateway API (/qosid/api/** va /qosid/admin/api/**) ---
    location /qosid/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # --- Ops sidecar API (faqat /ops/api — /ops sahifasi SPA'niki) ---
    location /ops/api/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # SSE (/ops/api/logs/stream) uchun bufferlashni o'chirish SHART — aks holda
        # jonli jurnal oynasi hech narsa ko'rsatmaydi yoki uzilib qoladi.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    # Aktuator (8091) ATAYLAB proksilanmaydi: unda autentifikatsiya yo'q va u
    # Prometheus metrikalarini beradi. Faqat loopback'da qolsin.
}
