# Test-classpath-only overrides. Production configuration lives in
# src/main/resources/application.yml and is NOT affected by this file (a .properties file
# does not shadow the main .yml — both are loaded, the yml wins on shared keys).
#
# gateway.admin.force-password-change: the default-password gate (DefaultPasswordGateFilter)
# is ON in production. Most admin tests deliberately log in with the seeded admin/admin
# account and then call protected admin routes, which the gate answers with
# 403 password-change-required. DefaultPasswordGateTest re-enables the gate explicitly and
# owns its coverage, so switching it off here changes nothing about the shipped default.
gateway.admin.force-password-change=false
